name: Build CYD Keyboard Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Build firmware
        run: pio run -e esp32-2432s028r

      - name: Prepare artifact
        run: |
          mkdir -p release
          cp .pio/build/esp32-2432s028r/firmware.bin release/cyd-keyboard-v2.1-firmware.bin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cyd-keyboard-firmware
          path: release/
